name: Automated Willow JSON Updater

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Fetch, Filter Old Credits, and Apply New Details
        run: |
          git pull origin main --rebase
          
          python3 - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime
          import pytz

          # সময় নির্ধারণ (Asia/Kolkata)
          tz = pytz.timezone('Asia/Kolkata')
          current_time = datetime.now(tz).strftime('%I:%M %p %d-%m-%Y')

          # -------------------------------------------------------------
          # ১. M3U প্লেলিস্ট প্রসেসিং
          # -------------------------------------------------------------
          m3u_url = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u"
          req = urllib.request.Request(m3u_url, headers={'User-Agent': 'Mozilla/5.0'})
          m3u_content = urllib.request.urlopen(req).read().decode('utf-8')

          # অরিজিনাল হেডার ও আগের ওনারের লাইনগুলো ব্লক/ফিল্টার করা
          cleaned_lines = []
          for line in m3u_content.splitlines():
              line_stripped = line.strip()
              # আগের যে লাইনগুলো বাদ দেওয়া হবে
              if any(line_stripped.startswith(tag) for tag in [
                  "#EXTM3U", "#PLAYLIST:", "#LAST_UPDATE:", "#TELEGRAM:", 
                  "#OWNER:", "#LIVE_COUNT:", "# Playlist Name:", "# Owner:",
                  "# Telegram:", "# Website:", "# Developer:", "# Version:", 
                  "# Channels Amount:", "# Last Update:"
              ]):
                  continue
              if line_stripped != "":
                  cleaned_lines.append(line)

          # চ্যানেল সংখ্যা গণনা
          channel_count = sum(1 for line in cleaned_lines if line.strip().startswith("#EXTINF"))

          # আপনার নতুন হেডার তৈরি
          new_m3u_header = [
              "#EXTM3U",
              "# Playlist Name: Willow Cricket Event Info",
              "# Owner: MD ANAMUL HOQUE",
              "# Telegram: https://t.me/ireentv",
              "# Website: https://anamul.pages.dev",
              "# Developer: IreenTechnology",
              "# Version: 1.0",
              f"# Channels Amount: {channel_count}",
              f"# Last Update: {current_time}",
              ""
          ]

          # willow.m3u ফাইলে সেভ করা
          final_m3u = "\n".join(new_m3u_header) + "\n" + "\n".join(cleaned_lines)
          with open("willow.m3u", "w", encoding="utf-8") as f:
              f.write(final_m3u.strip() + "\n")

          # -------------------------------------------------------------
          # ২. JSON প্লেলিস্ট প্রসেসিং
          # -------------------------------------------------------------
          json_url = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json"
          req_json = urllib.request.Request(json_url, headers={'User-Agent': 'Mozilla/5.0'})
          json_raw = urllib.request.urlopen(req_json).read().decode('utf-8')
          json_data = json.loads(json_raw)

          # JSON-এর ভেতর থেকে আগের ওনারের ডিটেইলস মুছে নতুন ডিটেইলস সেট করা
          new_json_data = {}
          new_json_data["playlist_name"] = "Willow Cricket Event Info"
          new_json_data["owner"] = "MD ANAMUL HOQUE"
          new_json_data["telegram"] = "https://t.me/ireentv"
          new_json_data["website"] = "https://anamul.pages.dev"
          new_json_data["developer"] = "IreenTechnology"
          new_json_data["version"] = "1.0"
          new_json_data["channels_amount"] = channel_count
          new_json_data["last_update"] = current_time

          if isinstance(json_data, dict):
              # আগের মেটাডাটা কীগুলো বাদ দেওয়া
              blocked_keys = ["playlist_name", "owner", "telegram", "website", "developer", "version", "last_update", "live_count", "LAST_UPDATE", "OWNER", "TELEGRAM"]
              for k, v in json_data.items():
                  if k not in blocked_keys:
                      new_json_data[k] = v
          elif isinstance(json_data, list):
              new_json_data["events"] = json_data

          # willow.json ফাইলে সেভ করা
          with open("willow.json", "w", encoding="utf-8") as f:
              json.dump(new_json_data, f, indent=2, ensure_ascii=False)

          # -------------------------------------------------------------
          # ৩. লগ ফাইল আপডেট
          # -------------------------------------------------------------
          with open("willow.txt", "a", encoding="utf-8") as f:
              f.write(f"🚀 Willow Synced | IST: {current_time} | Channels: {channel_count}\n")

          EOF

      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add willow.json willow.m3u willow.txt
          if ! git diff --cached --quiet; then
            git commit -m "Willow Database Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi