name: Automated Willow JSON Updater

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "ireentv"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Fetch, Filter Old Credits, and Apply New Details
        run: |
          git pull origin main --rebase
          
          python3 - << 'EOF'
          import urllib.request
          import json
          from datetime import datetime
          import pytz

          # সময় নির্ধারণ (Asia/Kolkata)
          tz = pytz.timezone('Asia/Kolkata')
          current_time = datetime.now(tz).strftime('%I:%M %p %d-%m-%Y')

          # -------------------------------------------------------------
          # ১. M3U প্লেলিস্ট ফিল্টারিং ও আপডেট
          # -------------------------------------------------------------
          m3u_url = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u"
          req = urllib.request.Request(m3u_url, headers={'User-Agent': 'Mozilla/5.0'})
          m3u_content = urllib.request.urlopen(req).read().decode('utf-8')

          # আগের ওনারের যেকোনো লেখা ফিল্টার করা
          cleaned_m3u_lines = []
          for line in m3u_content.splitlines():
              l = line.strip()
              # আগের ওনারের নাম, লিঙ্ক বা ট্যাগ থাকলে বাদ দেবে
              if any(bad.lower() in l.lower() for bad in ["hady", "sohanur", "livesportsplay", "#playlist:", "#last_update:", "#telegram:", "#owner:", "#live_count:"]):
                  continue
              if l.startswith("#EXTM3U") or l.startswith("# Playlist Name:") or l.startswith("# Owner:"):
                  continue
              if l != "":
                  cleaned_m3u_lines.append(line)

          # মোট চ্যানেল সংখ্যা গণনা
          channel_count = sum(1 for line in cleaned_m3u_lines if line.strip().startswith("#EXTINF"))

          # আপনার নতুন হেডার
          new_m3u = [
              "#EXTM3U",
              "# Playlist Name: Willow Cricket Event Info",
              "# Owner: MD ANAMUL HOQUE",
              "# Telegram: https://t.me/ireentv",
              "# Website: https://anamul.pages.dev",
              "# Developer: IreenTechnology",
              "# Version: 1.0",
              f"# Channels Amount: {channel_count}",
              f"# Last Update: {current_time}",
              ""
          ]
          new_m3u.extend(cleaned_m3u_lines)

          with open("willow.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(new_m3u).strip() + "\n")

          # -------------------------------------------------------------
          # ২. JSON প্লেলিস্ট ফিল্টারিং ও আপডেট
          # -------------------------------------------------------------
          json_url = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json"
          req_json = urllib.request.Request(json_url, headers={'User-Agent': 'Mozilla/5.0'})
          json_raw = urllib.request.urlopen(req_json).read().decode('utf-8')
          data = json.loads(json_raw)

          # আগের ওনার সংক্রান্ত ডেটা চেক করার ফাংশন
          def contains_old_credit(obj):
              s = json.dumps(obj).lower()
              return any(bad in s for bad in ["hady", "sohanur", "livesportsplay"])

          # আপনার মেটাডাটা
          meta = {
              "playlist_name": "Willow Cricket Event Info",
              "owner": "MD ANAMUL HOQUE",
              "telegram": "https://t.me/ireentv",
              "website": "https://anamul.pages.dev",
              "developer": "IreenTechnology",
              "version": "1.0",
              "channels_amount": channel_count,
              "last_update": current_time
          }

          blocked_keys = {
              "owner", "telegram", "website", "developer", "version", 
              "playlist_name", "playlist", "last_update", "live_count", 
              "admin", "channel_count", "channels_amount"
          }

          final_json = {}

          if isinstance(data, dict):
              cleaned_dict = {}
              for k, v in data.items():
                  # পুরনো মেটাডাটা কী বা ওনারের নাম থাকলে সরাসরি রিমুভ
                  if k.lower() in blocked_keys or contains_old_credit(k) or contains_old_credit(v):
                      continue
                  
                  # যদি ভ্যালু কোনো চ্যানেল লিস্ট হয়, তার ভেতর থেকেও ফিল্টার করবে
                  if isinstance(v, list):
                      cleaned_dict[k] = [item for item in v if not contains_old_credit(item)]
                  else:
                      cleaned_dict[k] = v
              
              final_json = {**meta, **cleaned_dict}

          elif isinstance(data, list):
              cleaned_list = [item for item in data if not contains_old_credit(item)]
              final_json = {**meta, "events": cleaned_list}

          # willow.json ফাইলে সেভ করা
          with open("willow.json", "w", encoding="utf-8") as f:
              json.dump(final_json, f, indent=2, ensure_ascii=False)

          # -------------------------------------------------------------
          # ৩. লগ ফাইল আপডেট
          # -------------------------------------------------------------
          with open("willow.txt", "a", encoding="utf-8") as f:
              f.write(f"🚀 Willow Synced | IST: {current_time} | Channels: {channel_count}\n")

          EOF

      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add willow.json willow.m3u willow.txt
          if ! git diff --cached --quiet; then
            git commit -m "Willow Database Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi
