name: IPTV Playlist Hourly Auto Update Bot

on:
  # ১. cronjob.org থেকে repository_dispatch মেথডে কল করলে চালু হবে
  repository_dispatch:
    types: [cronjob_trigger, update_playlist, render_trigger]

  # ২. cronjob.org থেকে সরাসরি workflow_dispatch মেথডে কল করলে বা ম্যানুয়ালি রান করলে চালু হবে
  workflow_dispatch:

  # ৩. ব্যাকআপ হিসেবে গিটহাবের নিজস্ব শিডিউলার (প্রতি ১ ঘণ্টা পরপর)
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # স্ক্রিপ্টের জন্য রিকোয়ার্ড লাইব্রেরি ইনস্টল নিশ্চিত করা
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install httpx; fi

      - name: Run IPTV Playlist Filter & Health Check
        run: |
          python scripts/update_playlist.py

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add working_playlist.m3u all_channels_status.m3u channels_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update working IPTV playlist [$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M %p BST')]" && git push)
