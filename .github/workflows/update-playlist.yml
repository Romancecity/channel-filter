name: IPTV Playlist Hourly Auto Update Bot

on:
  schedule:
    # প্রতি ১ ঘণ্টা পরপর অটো রান হবে (GitHub-এর পিক-আওয়ার লোড এড়াতে 0 মিনিটের বদলে 17 মিনিট দেওয়া হয়েছে)
    - cron: '17 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab or Workflow Dispatch API
  repository_dispatch:
    # Render বা এক্সটার্নাল স্ক্রিপ্ট থেকে ট্রিগার গ্রহণ করার জন্য
    # আপনি চাইলে নির্দিষ্ট নাম দিতে নিচের লাইনটি আনকমেন্ট করতে পারেন, আর কমেন্ট করা থাকলে যেকোনো event_type গ্রহণ করবে
    # types: [render-trigger]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run IPTV Playlist Filter & Health Check
        run: |
          python scripts/update_playlist.py

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add working_playlist.m3u all_channels_status.m3u channels_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update working IPTV playlist [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
