name: Update IreenTV VIP Playlist

on:
  schedule:
    # প্রতি ২৪ ঘণ্টা পর পর অটোমেটিক রান হবে (UTC 00:00 বা বাংলাদেশ সময় সকাল ৬:০০ টায়)
    - cron: '0 0 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write

jobs:
  merge-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge All Playlists and Generate Header
        run: |
          python - << 'EOF'
          import urllib.request
          from datetime import datetime, timezone, timedelta

          # ৩টি প্লেলিস্টের লিংক
          source_urls = [
              "https://raw.githubusercontent.com/Romancecity/channel-filter/refs/heads/main/working_playlist.m3u",
              "https://raw.githubusercontent.com/Romancecity/channel-filter/refs/heads/main/verify_mpd.m3u",
              "#"
          ]
          output_file = "IreenTV_vip.m3u"

          merged_channels = []
          channel_count = 0

          # প্রতিটি প্লেলিস্ট ডাউনলোড ও একত্রিত করা (কোনো ফিল্টার ছাড়া)
          for url in source_urls:
              print(f"Fetching: {url}")
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  content = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', errors='ignore')
              except Exception as e:
                  print(f"Error downloading playlist from {url}: {e}")
                  continue

              lines = content.splitlines()

              for line in lines:
                  line_clean = line.strip()
                  if not line_clean:
                      continue
                  # মাঝের ফাইলের #EXTM3U বাদ দেওয়া হচ্ছে যাতে ডুপ্লিকেট হেডার না হয়
                  if line_clean.startswith("#EXTM3U"):
                      continue
                  
                  merged_channels.append(line_clean)
                  # প্রতি স্ট্রিম লিংকের জন্য চ্যানেল কাউন্ট বাড়ানো
                  if not line_clean.startswith("#"):
                      channel_count += 1

          # বাংলাদেশ সময় (BST / UTC+6) বের করা
          bd_time = datetime.now(timezone(timedelta(hours=6))).strftime("%d-%m-%Y | %I:%M:%S %p (BST)")

          # কাস্টম হেডারের তথ্য সাজানো
          header = [
              "#EXTM3U",
              "# Playlist Name: IreenTV vip",
              "# Owner: MD ANAMUL HOQUE",
              "# Telegram: https://t.me/ireentv",
              "# Website: https://anamul.pages.dev",
              "# Developer: IreenTechnology",
              "# Version: 1.0",
              f"# Channels Amount: {channel_count}",
              f"# Last Update: {bd_time}",
              ""
          ]

          # সম্পূর্ণ ফাইল তৈরি ও সেভ করা
          final_content = header + merged_channels
          with open(output_file, "w", encoding="utf-8") as f:
              f.write("\n".join(final_content) + "\n")

          print(f"Merge complete! Total {channel_count} channels added.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add IreenTV_vip.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update IreenTV vip playlist [skip ci]" && git push)
